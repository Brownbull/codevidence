<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Candidate Skill Scanner</title>
    <!-- Preload fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&family=Inter:wght@300;400;500;600;700&family=Outfit:wght@300;400;500;600;700&family=IBM+Plex+Sans:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Theme flash prevention: read localStorage before first render -->
    <script>
      (function() {
        var theme = localStorage.getItem('css-theme');
        if (theme === 'dark') document.documentElement.classList.add('dark');
        else if (theme === 'dim') document.documentElement.classList.add('dim');
        var font = localStorage.getItem('css-font-family');
        if (font) {
          document.documentElement.style.setProperty(
            '--font-sans',
            font + ", ui-sans-serif, system-ui, sans-serif"
          );
        }
        var sizes = { small: '14px', normal: '16px', large: '18px', xlarge: '20px' };
        var textSize = localStorage.getItem('css-text-size');
        if (textSize && sizes[textSize]) {
          document.documentElement.style.fontSize = sizes[textSize];
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
